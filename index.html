<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/gradient.css">
</head>

<body>

    <div id="Navbar"></div>
    <script src="assets/js/navbar.js"></script>

    <h1>TCG Explorer</h1>
    <div id="gradient"></div>

    <!-- dashboard -->
    <div class="dashboard">
        <div class="dashboard-item">
            <h2>Mais Procuradas</h2>
            <p>As cartas mais procuradas pelos usuários.</p>
            <div class="cartas-mais-procuradas">
                <div class="carta1">
                    <span class="carta-numero">#1</span>
                    <span class="carta-nome">Charizard</span>
                    <img src="assets/images/charizard.png" alt="Charizard" class="carta-imagem">
                </div>
                <div class="carta2">
                    <span class="carta-numero">#2</span>
                    <span class="carta-nome">Blastoise</span>
                    <img src="assets/images/blastoise.png" alt="Blastoise" class="carta-imagem">
                </div>
                <div class="carta3">
                    <span class="carta-numero">#3</span>
                    <span class="carta-nome">Venusaur</span>
                    <img src="assets/images/venusaur.png" alt="Venusaur" class="carta-imagem">
                </div>
                <div class="carta4">
                    <span class="carta-numero">#4</span>
                    <span class="carta-nome">Pikachu</span>
                    <img src="assets/images/pikachu.png" alt="Pikachu" class="carta-imagem">
                </div>
                <div class="carta5">
                    <span class="carta-numero">#5</span>
                    <span class="carta-nome">Snorlax</span>
                    <img src="assets/images/snorlax.png" alt="Snorlax" class="carta-imagem">
                </div>
            </div>
        </div>
        <div class="dashboard-item">
            <h2>Novas Cartas</h2>
            <p>As cartas mais recentes adicionadas ao banco de dados.</p>
        </div>
        <div class="dashboard-item">
            <h2>Top Colecionadores</h2>
            <p>Os usuários com as maiores coleções de cartas.</p>
        </div>




        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <script src="assets/js/index.js"></script>
        <script src="assets/js/gradient.js"></script>
</body>

</html>
